<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Іконковий шрифт</title>
	<style>
		html,body{
			height: 100%;
		}
		body{
			padding: 1.875rem;
			font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
			font-size: 1em;
			background-color:#333;
			color:#fff;
		}
		.iconfont-page h1{
			font-size: 1.875rem;
			margin-bottom: 2rem;
		}
		.iconfont-page ul{
			display: flex;
			flex-wrap: wrap;
			gap: 2.5rem;
			margin: 0;
			padding: 0;
		}
		.iconfont-page ul li{
			margin-bottom: 0.625rem;
			display: inline-flex;
			gap: 0.625rem;
			list-style: none;
			align-items: center;
		}
		.iconfont-page ul li::before{
			font-size: 2rem;
		}
		@font-face { 
	font-family: "iconfont"; 
	font-display: swap;
	src: url("../../../../../../../../../../../src/assets/svgicons/preview/iconfont.woff2?fbbf4179dccd4b21da772e943962392e") format("woff2"); 
} 
[class*="--icon-"]::before{
	font-family: iconfont; 
}
	[class*="--icon-check"]::before { 
		content: "\f101"; 
	} 
	[class*="--icon-s-fb"]::before { 
		content: "\f102"; 
	} 
	[class*="--icon-s-insta"]::before { 
		content: "\f103"; 
	} 
	[class*="--icon-s-link"]::before { 
		content: "\f104"; 
	} 
	[class*="--icon-s-twyt"]::before { 
		content: "\f105"; 
	} 
	[class*="--icon-s-yt"]::before { 
		content: "\f106"; 
	} 

	</style>
</head>
<body>
	<div class="iconfont-page">
		<h1>Перелік іконок та їх класів:</h1>
		<ul>
				<li class="--icon-check">--icon-check</li>
				<li class="--icon-s-fb">--icon-s-fb</li>
				<li class="--icon-s-insta">--icon-s-insta</li>
				<li class="--icon-s-link">--icon-s-link</li>
				<li class="--icon-s-twyt">--icon-s-twyt</li>
				<li class="--icon-s-yt">--icon-s-yt</li>
		</ul>
	</div>
</body>
</html>
